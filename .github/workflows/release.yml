name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: '发布版本号 (semver，如 0.3.0)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run tests
        run: npm test

      - name: Sync package version
        run: npm version "${{ inputs.version }}" --no-git-tag-version --allow-same-version

      - name: Pack installer tarball
        run: npm pack

      - name: Create GitHub Release with installer and service templates
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="v${{ inputs.version }}"
          tarball=$(ls *.tgz | head -1)
          assets="$tarball com.dsh.lark-bridge.plist scripts/dsh-im-channel.service"
          notes="DSH ↔ IM Channel 安装包（跨平台，纯 Node JS）。"
          notes="${notes}\n- macOS 服务: launchd plist（com.dsh.lark-bridge.plist），npm i -g 后 node scripts/install.js install 注册 launchd"
          notes="${notes}\n- Linux 服务: systemd 用户服务模板（scripts/dsh-im-channel.service），bash scripts/install-linux.sh 安装"
          notes="${notes}\n要求 dsh >= 0.1.2（Gateway wire）"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$tag" $assets --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$tag" $assets \
              --repo "$GITHUB_REPOSITORY" \
              --title "dsh-im-channel ${{ inputs.version }}" \
              --notes "$notes"
          fi
